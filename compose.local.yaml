# Local Docker Desktop deploy: frontend on host port DEMO_HOST_PORT (8080 is taken on this host)
# and application telemetry also exported to Zabbix 8.0 APM.
# Set ZABBIX_APM_ENDPOINT (host:port of the Zabbix APM OTLP/gRPC collector) in .env.override. Guide for any application:
# https://github.com/SimonLexRS/zabbix-apm-dashboard/blob/main/docs/add-application.md
#
#   F="-f compose.yaml -f compose.full.yaml -f compose.observability.yaml -f compose.local.yaml --env-file .env --env-file .env.override"
#   docker compose $F pull && docker compose $F up -d --no-build

services:
  frontend-proxy:
    ports: !override
      - "${DEMO_HOST_PORT:-18080}:${ENVOY_PORT}"
      - "${ENVOY_ADMIN_PORT}:${ENVOY_ADMIN_PORT}"

  frontend:
    environment:
      - PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://localhost:${DEMO_HOST_PORT:-18080}/otlp-http/v1/traces

  otel-collector:
    command:
      - "--config=/etc/otelcol-config.yml"
      - "--config=/etc/otelcol-config-full.yml"
      - "--config=/etc/otelcol-config-observability.yml"
      - "--config=/etc/otelcol-config-zabbix.yml"
      - "--config=/etc/otelcol-config-extras.yml"
      - "--feature-gates=service.profilesSupport"
    volumes:
      - ./src/otel-collector/otelcol-config-zabbix.yml:/etc/otelcol-config-zabbix.yml
    environment:
      - ZABBIX_APM_ENDPOINT=${ZABBIX_APM_ENDPOINT:?set ZABBIX_APM_ENDPOINT in .env.override}
